name: Build Android APK and AAB Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Android Release APK
        run: flutter build apk --release

      - name: 📦 Build Android App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release

      - name: 🚀 Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Multi-Games-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🚀 Upload Release AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Multi-Games-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
